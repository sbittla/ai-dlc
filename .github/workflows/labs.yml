      - name: ADR-040 to ADR-043 pass Chapter 6's ADR checker (Lab 17.1 only)
        if: matrix.lab == 'labs/ch17/L17.1-load-test-bottleneck'
        working-directory: labs/ch06/L6.1-architecture-options-adr/solution
        run: python -m archscore.report adr --drivers ../data/drivers.json ../../../ch17/L17.1-load-test-bottleneck/relay-repo/docs/adr/ADR-040-workload-model-load-test-and-performance-budgets.md ../../../ch17/L17.1-load-test-bottleneck/relay-repo/docs/adr/ADR-041-shared-limiter-leases-blocks-of-counts.md ../../../ch17/L17.1-load-test-bottleneck/relay-repo/docs/adr/ADR-042-triage-routing-token-limits-and-cost-per-success.md ../../../ch17/L17.1-load-test-bottleneck/relay-repo/docs/adr/ADR-043-spend-quotas-and-spend-monitoring.md --gate
      - name: Relay 4.28.0 passes the workspace audit (Lab 17.1 only)
        if: matrix.lab == 'labs/ch17/L17.1-load-test-bottleneck'
