        run: python -m audit.report --policy ../data/policy.json --as-of 2027-02-19 --fail-on high ../../../ch16/L16.1-otel-redaction-slo/relay-repo

      - name: Relay 4.28.0 passes lint and the supply-chain check (Lab 17.1 only)
        if: matrix.lab == 'labs/ch17/L17.1-load-test-bottleneck'
        working-directory: labs/ch17/L17.1-load-test-bottleneck/relay-repo
        shell: bash
        run: |
          python tools/lint.py
