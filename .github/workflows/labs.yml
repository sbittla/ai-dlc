        run: python -m archscore.report adr --drivers ../data/drivers.json ../../../ch12/L12.1-agentic-red-team/relay-repo/docs/adr/ADR-032-untrusted-ticket-text-and-rendering.md ../../../ch12/L12.1-agentic-red-team/relay-repo/docs/adr/ADR-033-email-delivery-adapter.md ../../../ch12/L12.1-agentic-red-team/relay-repo/docs/adr/ADR-034-taint-memory-and-compaction-defenses.md ../../../ch12/L12.1-agentic-red-team/relay-repo/docs/adr/ADR-035-allowlisted-content-egress-path.md --gate
