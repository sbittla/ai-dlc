      - name: Relay 4.22.0 passes its own suite and lint (Lab 9.1 only)
        if: matrix.lab == 'labs/ch09/L9.1-spec-to-reviewed-pr'
        shell: bash
        working-directory: labs/ch09/L9.1-spec-to-reviewed-pr/solution/relay-repo
        run: |
          PYTHONPATH=src python -m pytest -q
          python tools/lint.py
      - name: PRD v1.1 passes Chapter 4's requirements gate (Lab 9.1 only)
        if: matrix.lab == 'labs/ch09/L9.1-spec-to-reviewed-pr'
        working-directory: labs/ch04/L4.1-brief-to-prd/solution
        run: python -m reqcheck.report --sources ../data/sources --lexicon ../data/lexicon.json ../../../ch09/L9.1-spec-to-reviewed-pr/data/prd-v1.1.md --gate
      - name: Spec 1.2.0 passes Chapter 5's spec checker (Lab 9.1 only)
        if: matrix.lab == 'labs/ch09/L9.1-spec-to-reviewed-pr'
