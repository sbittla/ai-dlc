[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lab-15-1-hardened-pipeline"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = []  # standard library only; no registry, cloud, model or GitHub is contacted

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[tool.setuptools]
packages = []  # a lab, not a library: nothing to install except dependencies

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -p no:cacheprovider"
