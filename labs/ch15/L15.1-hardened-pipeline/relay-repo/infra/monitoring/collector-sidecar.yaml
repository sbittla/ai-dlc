# OpenTelemetry Collector, sidecar in each Relay task (service, worker, migrate) (ADR-036, ADR-038).
#
# Relay's processes write OTLP JSON lines to /var/log/relay/otel on a task-local volume and make no network
# call themselves. This sidecar reads the files, applies a second, independent redaction pass, and forwards
# OTLP over HTTP to the gateway collector inside the VPC. It also tails the audit trail of agent actions.
#
# Component names are those of the collector-contrib distribution as of late 2026 (otlpjsonfile and filelog
# receivers; memory_limiter, attributes, redaction and batch processors; otlphttp exporter). Check each
# against the distribution and version you deploy before use: several are in alpha or beta stability.

receivers:
  otlpjsonfile:
    include: ["/var/log/relay/otel/*.jsonl"]
    start_at: beginning
  filelog/audit:   # each line stays the log body, byte for byte, so the chain still verifies downstream
    include: ["/var/log/relay/audit/agent-trail.jsonl"]
    start_at: beginning

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 200
  # Defence in depth: Relay already drops these keys. The collector drops them again in case a library or a
  # future change adds them.
  attributes/drop-content:
    actions:
      - {key: gen_ai.input.messages, action: delete}
      - {key: gen_ai.output.messages, action: delete}
      - {key: gen_ai.system_instructions, action: delete}
      - {key: gen_ai.prompt, action: delete}
      - {key: gen_ai.completion, action: delete}
      - {key: gen_ai.tool.call.arguments, action: delete}
      - {key: gen_ai.tool.call.result, action: delete}
      - {pattern: "^http\\.request\\.header\\..*", action: delete}
      - {pattern: "^http\\.response\\.header\\..*", action: delete}
      - {key: url.query, action: delete}
      - {key: client.address, action: delete}
      - {key: enduser.id, action: delete}
  # The redaction processor keeps only listed keys and masks values that match the blocked patterns.
  # The list mirrors src/relay/telemetry/semconv.py ALLOWED; tests/test_monitoring_config.py keeps them equal.
  redaction:
    allow_all_keys: false
    allowed_keys:
      - service.name
      - service.version
      - deployment.environment.name
      - http.request.method
      - http.route
      - http.response.status_code
      - error.type
      - db.system.name
      - db.operation.name
      - db.collection.name
      - gen_ai.operation.name
      - gen_ai.provider.name
      - gen_ai.request.model
      - gen_ai.response.model
      - gen_ai.usage.input_tokens
      - gen_ai.usage.output_tokens
      - gen_ai.response.finish_reasons
      - gen_ai.agent.id
      - gen_ai.agent.name
      - gen_ai.tool.name
      - gen_ai.tool.call.id
      - gen_ai.token.type
      - relay.prompt.version
      - relay.prompt.sha256
      - relay.agent.run_id
      - relay.agent.status
      - relay.agent.stop_reason
      - relay.agent.design
      - relay.step.seq
      - relay.step.outcome
      - relay.step.code
      - relay.args.sha256
      - relay.worker.outcome
      - relay.escalation.result
      - relay.security.event
      - relay.client.network
      - relay.credential.fingerprint
      - relay.sli.good
      - relay.slo.id
      - relay.triage.outcome
      - otel.metric.overflow
    blocked_values:
      - "[A-Za-z0-9._+-]+(@|%40)[A-Za-z0-9.-]+\\.[A-Za-z]{2,}"
      - "rly_(live|test)_[0-9a-f]{32}"
      - "rla_[A-Za-z0-9_-]{16,}\\.[A-Za-z0-9_-]{16,}"
      - "eyJ[A-Za-z0-9_-]{8,}\\.[A-Za-z0-9_-]{8,}\\.[A-Za-z0-9_-]{8,}"
      - "(AKIA|ASIA)[0-9A-Z]{16}"
    summary: info
  batch:
    timeout: 5s

exporters:
  otlphttp/gateway:
    endpoint: http://otel-gateway.relay-nonprod.internal:4318
  otlphttp/gateway-audit:
    endpoint: http://otel-gateway.relay-nonprod.internal:4319

service:
  pipelines:
    traces:
      receivers: [otlpjsonfile]
      processors: [memory_limiter, attributes/drop-content, redaction, batch]
      exporters: [otlphttp/gateway]
    metrics:
      receivers: [otlpjsonfile]
      processors: [memory_limiter, attributes/drop-content, redaction, batch]
      exporters: [otlphttp/gateway]
    logs:
      receivers: [otlpjsonfile]
      processors: [memory_limiter, attributes/drop-content, redaction, batch]
      exporters: [otlphttp/gateway]
    logs/audit:
      receivers: [filelog/audit]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/gateway-audit]
