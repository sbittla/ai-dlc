[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lab-11-1-guardrailed-cloud-environment"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = []  # standard library only; OpenTofu is needed only for the optional live mode

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[tool.setuptools]
packages = []  # a lab, not a library: nothing to install except dependencies

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
