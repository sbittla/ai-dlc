[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lab-17-1-load-test-bottleneck"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = []  # standard library only; the load test runs on 127.0.0.1 and no model is called

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[tool.setuptools]
packages = []  # a lab, not a library: nothing to install except dependencies

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -p no:cacheprovider"
