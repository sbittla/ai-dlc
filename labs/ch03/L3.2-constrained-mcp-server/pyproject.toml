[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lab-3-2-constrained-mcp-server"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = []  # the policy, the database and the report are standard library only

# MCP server only: pip install -e ".[mcp]"

[project.optional-dependencies]
dev = ["pytest==9.1.1"]
mcp = ["mcp==2.3.0"]

[tool.setuptools]
packages = []  # a lab, not a library: nothing to install except dependencies

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
