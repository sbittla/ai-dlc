# EDL evidence record for one change (the shape of Chapter 1, Listing 1.1).
# Fill every field. Check it with:  python -m audit.evidence ../evidence/evidence-record.yaml
change:                     # e.g. RLY-412
claim:                      # one sentence a reviewer can check, e.g. "Due dates display as stored for every supported zone"
spec:                       # the ticket or spec the claim comes from, with a version or date
autonomy_tier:              # T0–T4 (Chapter 1, Table 1.6); an agent editing on a branch in a sandbox is T2
author_of_record:           # the person accountable for the change, whoever or whatever typed it
agent:
  tool:                     # the coding agent and version, or "none"
  instructions:             # path and commit of the instructions file the agent read, e.g. AGENTS.md@<sha>
  session_log:              # where the agent's transcript or summary is kept, or "none"
checks:
  - name: failing test first
    command:                # e.g. python -m pytest -q   (the whole suite)
    commit:                 # the commit the test was run against, before the fix
    result:                 # e.g. "5 failed, 24 passed" for the whole suite
  - name: full suite after the fix
    command:
    commit:
    result:
  - name: lint
    command:
    result:
  - name: workspace audit
    command:                # python -m audit.report ... relay-repo
    result:                 # open findings by severity, and any waivers with owner and expiry
  - name: code review
    reviewer:               # a person who is not the author of record
    date:
    result:                 # approved, or approved after N revisions
release:
  merged_commit:
  note:                     # what would tell you in production that the claim is false
accepted_by:                # the reviewer who accepts the evidence; never the author of record
