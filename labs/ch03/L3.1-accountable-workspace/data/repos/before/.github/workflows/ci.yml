# Relay CI. The job names are the status checks branch protection requires.
name: ci
on: [pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install pytest==9.1.1
      - run: python -m pytest -q
      - run: python tools/lint.py
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The workspace audit from Lab 3.1, with the platform team's policy file.
      # A dedicated scanner over the full git history belongs here too (Chapter 13).
      - run: python -m audit.report --policy workspace-policy.json --fail-on high .
