# Egress proxy for background agent sessions (ADR-013; content paths ADR-035).
# HTTPS CONNECT to allowlisted domains on port 443 only; everything else is refused.
# The proxy resolves each name itself, so a client cannot reach another address by
# sending an allowlisted name; -n stops a CONNECT to a bare IP address matching through a
# reverse lookup that an attacker controls.
#
# 4.26.0 (ADR-035): the content hosts (the three GitHub names) serve anyone's content, so a
# domain allowlist cannot tell Relay's repository from an attacker's. Tunnels to those hosts
# are decrypted here (SslBump) and each request inside them must match a reviewed URL prefix
# for Relay's own repository. The package mirror, which Relay runs, is spliced: passed through
# encrypted, checked by name. A rule applies only when BOTH the CONNECT host and the handshake's
# server name are on its list, because a spliced tunnel gets no further check: a CONNECT to a
# content host that names the mirror in its handshake must not be spliced. Anything else is
# terminated, so a mismatched tunnel fails closed instead of skipping the path check. host_verify_strict refuses a request whose Host header does not match the
# destination it was sent to (domain fronting through a content host). The bump CA is generated
# per environment at deploy and trusted only by the sandbox image; its key never leaves the proxy
# task. This configuration is checked by Relay's tests and Lab 12.1's model of it; it has not yet
# been run in a container (ADR-035).

http_port 3128 ssl-bump tls-cert=/etc/squid/bump/ca.pem tls-key=/etc/squid/bump/ca.key generate-host-certificates=on
sslcrtd_program /usr/lib/squid/security_file_certgen -s /var/lib/squid/ssl_db -M 4MB

acl sandbox src 10.40.21.0/24
acl allowed_domains dstdomain -n "/etc/squid/allowlist.txt"
acl content_hosts dstdomain -n "/etc/squid/content-hosts.txt"
acl content_sni ssl::server_name "/etc/squid/content-hosts.txt"
acl splice_sni ssl::server_name "/etc/squid/splice-hosts.txt"
acl splice_dst dstdomain -n "/etc/squid/splice-hosts.txt"
acl relay_content url_regex "/etc/squid/content-urls.txt"
acl https_port port 443
acl CONNECT method CONNECT
acl decrypted proto HTTPS
acl step1 at_step SslBump1

ssl_bump peek step1
ssl_bump bump content_sni content_hosts
ssl_bump splice splice_sni splice_dst
ssl_bump terminate all
host_verify_strict on

http_access deny !sandbox
http_access deny CONNECT !https_port
http_access allow CONNECT allowed_domains
http_access allow decrypted content_hosts relay_content
http_access deny all

cache deny all
access_log stdio:/dev/stdout
