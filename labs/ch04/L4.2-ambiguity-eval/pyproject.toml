[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lab-4-2-ambiguity-eval"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = []  # standard library only for offline runs

# Live mode only: pip install -e ".[live]"

[project.optional-dependencies]
dev = ["pytest==9.1.1"]
live = ["anthropic>=2.6,<3"]

[tool.setuptools]
packages = []  # a lab, not a library: nothing to install except dependencies

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
