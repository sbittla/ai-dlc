# Relay: the triage eval gate as a required status check.
#
# ILLUSTRATIVE ONLY. The lab does not run this workflow, and it refers to a helper,
# evals/triage/spec.py, that you would write for your own repository.
#
# Design choices to keep when you adapt it:
# - No `paths:` filter on the trigger. A required check that is skipped by a path filter
#   can stay "pending" and block unrelated pull requests, so the job always runs and
#   exits quickly with success when nothing that affects triage changed.
# - The candidate is derived from the pull request's own configuration
#   (triage/models.yaml and the prompt it names), and the baseline from main. A file in
#   which the pull request declares its own candidate could gate the wrong thing.
# - The live step runs pull-request code with an API key, so the environment requires a
#   reviewer's approval, and secrets are never available to pull requests from forks.
name: triage-eval

on:
  pull_request:

permissions:
  contents: read

jobs:
  triage-eval:
    runs-on: ubuntu-latest
    environment: eval-live       # protected: required reviewers; holds the evaluation-only credential
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Did anything that affects triage change?
        id: scope
        run: |
          if git diff --quiet "origin/${{ github.base_ref }}...HEAD" -- \
               triage/prompts triage/models.yaml triage/tools evals/triage; then
            echo "affected=false" >> "$GITHUB_OUTPUT"
            echo "No prompt, model, tool or eval change: gate not needed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "affected=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.scope.outputs.affected == 'true'
        with:
          python-version: "3.11"
      - name: Install the suite with the live extra
        if: steps.scope.outputs.affected == 'true'
        working-directory: evals/triage
        run: python -m pip install -e ".[live]"
      - name: Gate the pull request's configuration against main's
        if: steps.scope.outputs.affected == 'true'
        working-directory: evals/triage/solution
        env:
          ANTHROPIC_API_KEY: ${{ secrets.EVAL_ANTHROPIC_API_KEY }}
        run: |
          baseline="$(python ../spec.py --ref "origin/${{ github.base_ref }}")"   # e.g. claude-opus-5-5:triage-v1
          candidate="$(python ../spec.py --ref HEAD)"
          python -m evalsuite.report --data ../data gate --live --max-usd 5 \
            --baseline "$baseline" --candidate "$candidate" | tee "$GITHUB_STEP_SUMMARY"
          exit "${PIPESTATUS[0]}"
